<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>観光地を追加 | 旅行先提案Webシステム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet / CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

  <style>
    /* ===== テーマ ===== */
    :root[data-theme="light"]{
      color-scheme:light;
      --bg:#f7f7f8; --text:#0f172a; --subtle:#475569;
      --panel:#ffffff; --border:#e5e7eb; --primary:#4f46e5;
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --bg:#0b0f14; --text:#e5e7eb; --subtle:#9aa4b2;
      --panel:#111827; --border:#1f2937; --primary:#6366f1;
    }
    :root{ --nav-h:56px; }

    /* ===== 全体 ===== */
    html, body{
      margin:0; padding:0; height:100%;
      font-family:'Orbitron','Arial',sans-serif;
      background:var(--bg); color:var(--text);
      overflow:hidden;
    }

    /* ===== 2カラム固定レイアウト ===== */
    .addition-layout{
      display:grid;
      grid-template-columns: 360px 1fr; /* 左固定 / 右可変 */
      gap:12px;
      height:calc(100dvh - var(--nav-h)); /* ← 画面高 - ナビ高さ */
      padding:12px;
      box-sizing:border-box;
    }

    /* ===== 左パネル：上=SV / 仕切り / 下=フォーム ===== */
    #leftPanel{
      display:grid;
      grid-template-rows: var(--left-sv-h, 260px) 8px 1fr;
      gap:12px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      overflow:hidden;
    }
    #streetview-container{
      width:100%; height:100%;
      border:1px solid var(--border);
      border-radius:12px;
      overflow:hidden;
      background:#0001;
      position:static;
      box-shadow:none;
      transition:none;
    }
    #streetview{ width:100%; height:100%; border:none; }

    .left-resizer{
      align-self:stretch;
      cursor:row-resize;
      position:relative;
      user-select:none; touch-action:none;
      border-radius:6px; background:transparent;
    }
    .left-resizer::before{
      content:""; position:absolute; left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:64px; height:3px;
      border-radius:2px; background:var(--border); opacity:.9;
    }

    .left-form{
      overflow:auto; padding-right:4px;
    }
    .left-form label{ display:block; margin-top:10px; font-weight:600; }
    .left-form input[type="text"],
    .left-form textarea,
    .left-form select{
      width:100%; margin-top:6px; padding:8px 10px;
      border:1px solid var(--border); border-radius:8px; font-size:14px;
      background:var(--panel); color:var(--text);
    }
    .left-form textarea{ min-height:96px; resize:vertical; }
    .custom-file-upload{
      display:inline-block; padding:8px 12px; margin-top:8px;
      border:1px solid #888; border-radius:8px; cursor:pointer; user-select:none;
      background:#f6f6f6;
    }
    .custom-file-upload input{ display:none; }
    #aiStatus{ margin-left:6px; color:#666; font-size:12px; }
    #fileNameDisplay{ margin-left:8px; color:#444; font-size:12px; }
    #preview{
      display:none; width:100%; max-height:220px; object-fit:cover;
      margin-top:10px; border-radius:10px; border:1px solid #ddd;
    }
    #deleteImage{ display:none; margin-top:8px; }
    #confirmBtn{
      width:100%; margin-top:14px; padding:12px;
      border:none; border-radius:10px; font-weight:700; cursor:pointer;
      background:var(--primary); color:#fff;
    }

    /* ===== 右パネル（地図） ===== */
    .right-panel{
      display:grid; grid-template-rows:1fr;
      gap:12px; min-height:0;
    }
    #map{
      width:100%; height:100%;
      border:1px solid var(--border);
      border-radius:12px;
      background:#0001;
      position:static;
      margin:0;
    }

    /* ===== モバイル ===== */
    @media (max-width: 820px){
      .addition-layout{
        grid-template-columns: 1fr;
        grid-template-rows: auto 60vh; /* 上=左パネル / 下=地図 */
      }
    }
  </style>

  <script>
    // ナビバーの実高さを測って --nav-h に反映
    function applyNavHeightForAddition() {
      const host = document.getElementById('navbar-placeholder');
      const navEl = (host && host.firstElementChild) ? host.firstElementChild : host;
      const h = Math.max(0, Math.round((navEl?.getBoundingClientRect().height || 56)));
      document.documentElement.style.setProperty('--nav-h', h + 'px');
      if (host) host.style.height = h + 'px';
    }
    window.addEventListener('load', applyNavHeightForAddition);
    window.addEventListener('resize', applyNavHeightForAddition);
  </script>
</head>

<body class="addition-page" data-theme="light">
  <div id="navbar-placeholder"></div>

  <main class="addition-layout">
    <!-- 左：上=ストビュー／仕切り／下=フォーム -->
    <section id="leftPanel" aria-label="操作パネル">
      <div id="streetview-container">
        <iframe id="streetview" src="" allowfullscreen></iframe>
      </div>

      <div class="left-resizer" role="separator" aria-orientation="horizontal" tabindex="0"></div>

      <div class="left-form">
        <div style="margin: 8px 0;">
          <input type="text" id="addressInput" placeholder="住所を入力してください" style="width: calc(100% - 140px);" />
          <button id="geocodeBtn" style="width: 130px;">🔍 ピンを住所に移動</button>
        </div>

        <label>📍 観光地のタイトル：</label>
        <input type="text" id="title" placeholder="例：白川郷" />

        <div style="margin-top: 10px;">
          <button id="aiSuggestBtn" type="button">✨ AIで自動生成</button>
          <span id="aiStatus"></span>
        </div>

        <label>🎨 ジャンル：</label>
        <select id="genre">
          <option value="historic">歴史的建造物</option>
          <option value="nature">自然</option>
          <option value="city">都市景観</option>
          <option value="culture">文化的名所</option>
        </select>

        <label>📝 観光地の説明：</label>
        <textarea id="description" placeholder="ここに観光地の説明を入力してください..."></textarea>

        <label for="imageUpload">🖼 観光地の写真をアップロード：</label>
        <label class="custom-file-upload">
          ファイルを選択
          <input type="file" id="imageUpload" accept="image/*" />
        </label>
        <span id="fileNameDisplay">未選択</span>

        <img id="preview" src="" alt="プレビュー画像" />
        <button id="deleteImage" type="button">削除</button>

        <button id="confirmBtn" type="button">✅ この観光地を追加</button>
      </div>
    </section>

    <!-- 右：地図のみ -->
    <section class="right-panel" aria-label="地図">
      <div id="map"></div>
    </section>
  </main>

  <!-- JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/navbar.js"></script>
  <script type="module" src="js/addition.js"></script>
</body>
</html>
