<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パスワードリセット | 旅行先提案Webシステム</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="auth-container">
    <h1>🔑 パスワードをお忘れですか？</h1>
    <p class="description">
      ご登録時のユーザーIDまたはメールアドレスを入力してください。<br>
      パスワード再設定用の「6桁の確認コード」をメールでお送りします。
    </p>

    <form class="auth-form" id="forgotForm">
      <label for="identifier">🆔 ユーザーID または 📧 メールアドレス</label>
      <input type="text" id="identifier" name="identifier"
             placeholder="ユーザーID または メールアドレス" required>

      <button type="submit">確認コードを送信</button>
    </form>

    <div class="auth-links">
      <a href="login.html">← ログインに戻る</a>
    </div>
  </div>

  <script src="../js/navbar.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const identifier = document.getElementById('identifier').value.trim();
      if (!identifier) {
        alert('ユーザーIDまたはメールアドレスを入力してください。');
        return;
      }

      try {
        const res = await fetch('/api/password/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier })
        });

        const data = await res.json();
        console.log('[forgot] response:', data);

        if (!res.ok) {
          alert(data.error || 'パスワード再設定メールの送信に失敗しました。');
          return;
        }

        if (!data.ok) {
          alert(data.message || 'パスワード再設定メールの送信に失敗しました。');
          return;
        }

        // 一時トークンをブラウザに保存（contact.html で使う）
        if (data.pending_token) {
          sessionStorage.setItem('pw_reset_token', data.pending_token);
        }

        alert('パスワード再設定用の確認コードをメールで送信しました。メールを確認してください。');

        // 6桁コード入力画面へ遷移
        window.location.href = 'contact.html';

      } catch (err) {
        console.error('[forgot] error:', err);
        alert('サーバーとの通信に失敗しました。');
      }
    });
  </script>
</body>
</html>
