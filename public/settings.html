<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定 | 旅行先提案Webシステム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script defer src="js/navbar.js"></script>
  <script defer src="js/settings.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="settings-container">
    <h1>⚙ 設定</h1>

    <!-- 地図で住所を設定 -->
    <div class="setting-section">
      <label>📍 住所の設定（地図でピンを動かす） ：</label>
      <div id="map" style="height: 400px;"></div>
      <p id="locationDisplay">選択された位置：--</p>
      <button id="confirmLocation">✅ この位置を保存</button>
    </div>

    <!-- ジオコーディング（住所からピンを動かす） -->
    <div style="margin: 10px 0;">
    <input
      type="text"
      id="addressInput"
      placeholder="住所を入力してください"
      style="width: 400px; height: 40px; font-size: 1rem; padding: 6px;"
    >
      <button id="geocodeBtn">🔍 ピンを住所に移動</button>
    </div>

    <!-- 現在保存されている住所表示と削除 -->
    <div class="setting-section">
      <label>📍 現在設定されている住所：</label>
      <div class="location-display-row">
        <p id="savedLocationDisplay" class="location-text">--</p>
        <button id="deleteLocation" class="delete-btn">🗑️ 削除</button>
      </div>
    </div>
    <!-- アカウント情報（表示＆編集） -->
<div class="setting-section">
  <h2>👤 アカウント情報</h2>

  <div class="field-row">
    <label>現在のID：</label>
    <span id="currentId">--</span>
  </div>
  <div class="field-row">
    <label>現在のメール：</label>
    <span id="currentEmail">--</span>
  </div>
</div>

<!-- ID / メール変更フォーム -->
<div class="setting-section">
  <h3>✏️ ID / メールアドレスの変更</h3>
  <div class="field-row">
    <label for="newUsername">新しいID</label>
    <input id="newUsername" type="text" placeholder="（変更しない場合は空でOK）">
  </div>
  <div class="field-row">
    <label for="newEmail">新しいメール</label>
    <input id="newEmail" type="email" placeholder="（変更しない場合は空でOK）">
  </div>
  <div class="field-row">
    <label for="currentPasswordForProfile">現在のパスワード</label>
    <input id="currentPasswordForProfile" type="password" placeholder="確認のため必須">
  </div>
  <button id="saveProfileBtn">💾 保存</button>
  <p id="profileMsg" class="msg"></p>
</div>

<!-- パスワード変更フォーム -->
<div class="setting-section">
  <h3>🔒 パスワードの変更</h3>
  <div class="field-row">
    <label for="currentPassword">現在のパスワード</label>
    <input id="currentPassword" type="password" placeholder="現在のパスワード">
  </div>
  <div class="field-row">
    <label for="newPassword">新しいパスワード</label>
    <input id="newPassword" type="password" placeholder="新しいパスワード">
  </div>
  <div class="field-row">
    <label for="newPassword2">新しいパスワード（確認）</label>
    <input id="newPassword2" type="password" placeholder="もう一度入力">
  </div>
  <button id="changePasswordBtn">🔁 パスワードを変更</button>
  <p id="passwordMsg" class="msg"></p>
</div>

  </div>
</body>
</html>
