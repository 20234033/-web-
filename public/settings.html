<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定 | 旅行先提案Webシステム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script defer src="js/navbar.js"></script>
  <script defer src="js/settings.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="settings-container">
    <h1>⚙ 設定</h1>

    <!-- 地図で住所を設定 -->
    <div class="setting-section">
      <label>📍 住所の設定（地図でピンを動かす）：</label>
      <div id="map" style="height: 400px;"></div>
      <p id="locationDisplay">選択された位置：--</p>
      <button id="confirmLocation">✅ この位置を保存</button>
    </div>

    <!-- ジオコーディング（住所からピンを動かす） -->
    <div style="margin: 10px 0;">
      <input
        type="text"
        id="addressInput"
        placeholder="住所を入力してください"
        style="width: 400px; height: 40px; font-size: 1rem; padding: 6px;"
      >
      <button id="geocodeBtn">🔍 ピンを住所に移動</button>
    </div>

    <!-- 現在保存されている住所表示と削除 -->
    <div class="setting-section">
      <label>📍 現在設定されている住所：</label>
      <div class="location-display-row">
        <p id="savedLocationDisplay" class="location-text">--</p>
        <button id="deleteLocation" class="delete-btn">🗑️ 削除</button>
      </div>
    </div>

    <!-- アカウント情報（表示） -->
    <div class="setting-section">
      <h2>👤 アカウント情報</h2>

      <div class="field-row">
        <label>現在のID：</label>
        <span id="currentId">--</span>
      </div>
      <div class="field-row">
        <label>現在のメール：</label>
        <span id="currentEmail">--</span>
      </div>
    </div>

    <!-- メールで送る変更用リンク（ID / メール / パスワード / 削除） -->
    <div class="setting-section">
      <h3>✏️ アカウント情報の変更</h3>

      <!-- ID変更リンク -->
      <div class="row">
        <div>現在のID：<span id="currentIdDisplayForLink">--</span></div>
        <button id="sendIdChangeLinkBtn">ID変更用リンクを送信</button>
      </div>
      <div id="idChangeMsg" class="msg"></div>

      <!-- メールアドレス変更リンク -->
      <div class="row" style="margin-top: 8px;">
        <div>現在のメールアドレス：<span id="currentEmailDisplayForLink">--</span></div>
        <button id="sendEmailChangeLinkBtn">メール変更用リンクを送信</button>
      </div>
      <div id="emailChangeMsg" class="msg"></div>

      <!-- パスワード変更リンク -->
      <div class="row" style="margin-top: 8px;">
        <div>現在のパスワード：••••••••</div>
        <button id="sendPasswordChangeLinkBtn">パスワード変更用リンクを送信</button>
      </div>
      <div id="passwordChangeMsg" class="msg"></div>

      <!-- アカウント削除リンク -->
      <div class="row" style="margin-top: 16px;">
        <div>アカウントの削除：</div>
        <button id="sendDeleteAccountLinkBtn" class="danger-btn">
          アカウント削除用リンクを送信
        </button>
      </div>
      <div id="deleteAccountMsg" class="msg"></div>
    </div>
  </div>

  <script>
    // currentId / currentEmail を 2 箇所に反映
    document.addEventListener('DOMContentLoaded', () => {
      const mainId = document.getElementById('currentId');
      const linkId = document.getElementById('currentIdDisplayForLink');
      const mainEmail = document.getElementById('currentEmail');
      const linkEmail = document.getElementById('currentEmailDisplayForLink');

      const sync = () => {
        if (mainId && linkId) linkId.textContent = mainId.textContent;
        if (mainEmail && linkEmail) linkEmail.textContent = mainEmail.textContent;
      };

      sync();
      setTimeout(sync, 500);
      setTimeout(sync, 1500);
    });
  </script>
</body>
</html>
